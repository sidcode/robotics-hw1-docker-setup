services:
  hw1:
    build:
      # Build context is the course root so the image can COPY the HW1 workspace.
      context: ..
      dockerfile: docker/Dockerfile
    image: robots101-hw1:latest
    container_name: robots101_hw1
    runtime: nvidia            # comment out this line if the machine has no NVIDIA GPU
    privileged: true
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=1
      # Disable Gazebo's online model database lookup -- it makes the gzclient GUI
      # hang on "Preparing your world" on first run. All HW1 models are local.
      - GAZEBO_MODEL_DATABASE_URI=
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/root/.Xauthority:rw
      # Persist recordings (bags / CSVs / videos) on the host.
      - ./output:/root/output:rw
    devices:
      - /dev/dri:/dev/dri
    stdin_open: true
    tty: true
